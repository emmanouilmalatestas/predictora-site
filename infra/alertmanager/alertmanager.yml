global:
  resolve_timeout: 5m

route:
  receiver: "slack-default"
  group_by: ['alertname', 'service']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h

  routes:
    - match:
        severity: "critical"
      receiver: "telegram-critical"

    - match:
        severity: "warning"
      receiver: "slack-warning"

    - match_re:
        severity: "info|low"
      receiver: "slack-low"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ['alertname', 'service']

receivers:

  - name: "slack-default"
    slack_configs:
      - channel: "#warzone-alerts"
        api_url: "https://hooks.slack.com/services/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"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}*{{ .Labels.severity | toUpper }}* — {{ .Annotations.description }}\n{{ end }}"

  - name: "slack-warning"
    slack_configs:
      - channel: "#warzone-alerts"
        api_url: "https://hooks.slack.com/services/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"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}*WARNING* — {{ .Annotations.description }}\n{{ end }}"

  - name: "slack-low"
    slack_configs:
      - channel: "#warzone-alerts-low"
        api_url: "https://hooks.slack.com/services/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"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: "telegram-critical"
    webhook_configs:
      - url: "https://api.telegram.org/bot8791478475:AAH_6j24qpFWH0v78Sdsj4IJMl5gVwUzsoQ/sendMessage?chat_id=7747676404&parse_mode=Markdown&text={{ range .Alerts }}⚠️ *{{ .Labels.alertname }}* — {{ .Annotations.description }}{{ end }}"
        send_resolved: true
