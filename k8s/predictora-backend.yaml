apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictora-backend
  namespace: default
  labels:
    app: predictora-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: predictora-backend
  template:
    metadata:
      labels:
        app: predictora-backend
    spec:
      containers:
      - name: predictora-backend
        image: localhost:5000/predictoraai-backend:prod
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
