name: Deploy to PredictoraAI Prod

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/predictoraai-backend:latest backend
          docker push ghcr.io/${{ github.repository }}/predictoraai-backend:latest

      - name: Build & push admin frontend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/predictoraai-admin-frontend:latest admin-frontend
          docker push ghcr.io/${{ github.repository }}/predictoraai-admin-frontend:latest

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: predictoraai.com
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deploy/predictoraai
            docker compose pull
            docker compose up -d --force-recreate
